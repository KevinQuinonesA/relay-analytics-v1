[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
