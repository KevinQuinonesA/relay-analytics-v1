services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay
      TEST_DATABASE_URL: postgresql+psycopg://relay:relay@db:5432/relay_test
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/accounts')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: deps
    command: npm test
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db-data:
